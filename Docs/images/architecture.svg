<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect width="980" height="420" fill="#FFFFFF"/>

  <!-- 1. Sources -->
  <rect x="20" y="150" width="160" height="120" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#312E81">실행 중인 앱</text>
  <text x="100" y="205" text-anchor="middle" font-size="12" fill="#4338CA">Safari · Music</text>
  <text x="100" y="222" text-anchor="middle" font-size="12" fill="#4338CA">Zoom · 시스템음</text>
  <text x="100" y="248" text-anchor="middle" font-size="11" fill="#6B7280">(내부 오디오)</text>

  <!-- 2. Process Tap -->
  <rect x="240" y="130" width="190" height="160" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="335" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Core Audio</text>
  <text x="335" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#065F46">Process Tap</text>
  <text x="335" y="202" text-anchor="middle" font-size="11" fill="#047857">CATapDescription</text>
  <text x="335" y="218" text-anchor="middle" font-size="11" fill="#047857">AudioHardwareCreateProcessTap</text>
  <text x="335" y="234" text-anchor="middle" font-size="11" fill="#047857">+ Aggregate Device</text>
  <text x="335" y="258" text-anchor="middle" font-size="10" fill="#6B7280">가상 드라이버 설치·재부팅 불필요</text>

  <!-- 3. Encoder -->
  <rect x="480" y="150" width="160" height="120" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="560" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#92400E">AudioEncoder</text>
  <text x="560" y="208" text-anchor="middle" font-size="11" fill="#B45309">PCM → AAC</text>
  <text x="560" y="224" text-anchor="middle" font-size="11" fill="#B45309">AVAudioConverter</text>

  <!-- 4. Broadcast Server -->
  <rect x="690" y="130" width="190" height="160" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="785" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#9D174D">BroadcastServer</text>
  <text x="785" y="180" text-anchor="middle" font-size="11" fill="#BE185D">NWListener (Network)</text>
  <text x="785" y="198" text-anchor="middle" font-size="11" fill="#BE185D">GET /stream.aac</text>
  <text x="785" y="214" text-anchor="middle" font-size="11" fill="#BE185D">청크 전송 인코딩</text>
  <text x="785" y="232" text-anchor="middle" font-size="10" fill="#6B7280">localhost:17320</text>
  <text x="785" y="250" text-anchor="middle" font-size="10" fill="#6B7280">(사설망만 바인딩)</text>

  <!-- 5. Safari -->
  <rect x="770" y="320" width="150" height="80" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="845" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">Safari</text>
  <text x="845" y="373" text-anchor="middle" font-size="11" fill="#1D4ED8">&lt;audio&gt; 실시간 재생</text>

  <!-- arrows -->
  <path d="M180,210 L240,210" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M430,210 L480,210" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M640,210 L690,210" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M835,290 L840,320" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <text x="490" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">콜슨믹서 — 내부 오디오 → Safari 웹방송 파이프라인</text>
</svg>
